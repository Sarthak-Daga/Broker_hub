services:
  postgres:
    image: postgres:17
    container_name: brokerhub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: brokerhub
      POSTGRES_PASSWORD: brokerhub_dev
      POSTGRES_DB: brokerhub

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: